# Vérifie que les catalogues générés correspondent aux fichiers Markdown.
name: Vérifier le contenu éditorial

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/generate-*.mjs"
      - "app/jobs.generated.ts"
      - "app/events.generated.ts"
      - "app/board.generated.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Vérifier les annonces et les archives
        run: npm run content:check

      - name: Tester les règles du contenu
        run: npm run test:content
