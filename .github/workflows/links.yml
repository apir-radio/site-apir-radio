# Contrôle périodique des liens externes, sans bloquer une publication.
name: Vérifier les liens externes

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build:pages

      - name: Vérifier les liens
        id: links
        continue-on-error: true
        run: node scripts/check-links.mjs out

      - name: Résumer le contrôle des liens
        if: always()
        run: |
          {
            echo "## Contrôle des liens externes"
            if [[ "${{ steps.links.outcome }}" == "success" ]]; then
              echo "✅ Aucun lien externe cassé détecté."
            else
              echo "⚠️ Des liens externes nécessitent une vérification. Consulter les logs du contrôle."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
