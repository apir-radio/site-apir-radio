# Déploiement GitHub Pages du site APIR
name: Publier le site APIR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les catalogues générés
        run: npm run content:check

      - name: Tester les règles du contenu
        run: npm run test:content

      - name: Vérifier TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Vérifier ESLint
        run: npm run lint

      - name: Déterminer le chemin GitHub Pages
        shell: bash
        run: |
          if [[ -f public/CNAME ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi

      - name: Construire le site statique
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Envoyer le site généré
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
