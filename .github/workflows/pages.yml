# Déploiement GitHub Pages du site APIR
name: Publier le site APIR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les catalogues générés
        run: npm run content:check

      - name: Tester les règles du contenu
        run: npm run test:content

      - name: Vérifier TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Vérifier ESLint
        run: npm run lint

      - name: Auditer les dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Déterminer le chemin GitHub Pages
        shell: bash
        run: |
          if [[ -f public/CNAME ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi

      - name: Construire le site statique
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Vérifier le HTML généré
        run: node --test tests/rendered-html.test.mjs

      - name: Vérifier les ancres internes
        run: npm run anchors:check

      - name: Installer Chromium pour les tests UI
        run: npx playwright install --with-deps chromium

      - name: Tester les parcours principaux
        run: npm run test:ui

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Envoyer le site généré
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
