# Audit périodique de qualité web : une régression sous les seuils bloque le contrôle.
name: Auditer le site (Lighthouse)

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build:pages

      - name: Lancer l’audit Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.cjs
