# Audit périodique indicatif : les seuils sont des avertissements et ne bloquent pas le site.
name: Auditer le site (Lighthouse)

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build:pages

      - name: Lancer l’audit Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.cjs
